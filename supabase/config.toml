# Configuration Supabase CLI (développement local : `supabase start`)
project_id = "toi-et-moi"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "toietmoi://"
# Liens de retour autorisés après confirmation d'e-mail, lien magique, OAuth ou
# réinitialisation du mot de passe (application native + web en développement).
additional_redirect_urls = [
  "toietmoi://auth/callback",
  "toietmoi://auth/reset",
  "toietmoi://**",
  "exp://127.0.0.1:8081/--/auth/callback",
  "http://localhost:8081/auth/callback",
  "http://localhost:8081/auth/reset",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 10
password_requirements = "lower_upper_letters_digits"

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
max_frequency = "1m0s"

[auth.rate_limit]
email_sent = 4
sign_in_sign_ups = 30
token_verifications = 30

# ---------------------------------------------------------------------
# Connexion « Se connecter avec Apple » (désactivée par défaut)
# Pour l'activer :
#  1. Apple Developer › Identifiers : créer un Services ID (ex. fr.toietmoi.auth)
#     et une clé « Sign in with Apple » ; générer le secret JWT (valable 6 mois).
#  2. Exporter SUPABASE_AUTH_APPLE_CLIENT_ID (bundle id iOS, et Services ID
#     séparés par des virgules) et SUPABASE_AUTH_APPLE_SECRET dans l'environnement
#     (fichier supabase/.env, jamais commité).
#  3. Passer enabled = true ; en production, faire de même dans
#     Dashboard › Authentication › Providers › Apple.
# ---------------------------------------------------------------------
[auth.external.apple]
enabled = false
client_id = "env(SUPABASE_AUTH_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_APPLE_SECRET)"

# ---------------------------------------------------------------------
# Connexion « Se connecter avec Google » (désactivée par défaut)
# Pour l'activer :
#  1. Google Cloud Console › Identifiants : créer les ID client OAuth
#     (Web, iOS, Android) ; l'ID « Web » sert de client_id ici, les autres
#     peuvent être ajoutés à la suite, séparés par des virgules.
#  2. Exporter SUPABASE_AUTH_GOOGLE_CLIENT_ID et SUPABASE_AUTH_GOOGLE_SECRET
#     dans l'environnement (supabase/.env, jamais commité).
#  3. Passer enabled = true ; en production, faire de même dans
#     Dashboard › Authentication › Providers › Google.
# skip_nonce_check = true est nécessaire pour la connexion native par jeton
# d'identité (signInWithIdToken) : le SDK Google natif ne transmet pas le nonce.
# ---------------------------------------------------------------------
[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
skip_nonce_check = true

[storage]
enabled = true
file_size_limit = "25MiB"

[functions.assistant]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

[functions.product-lookup]
verify_jwt = true

[functions.scan-explain]
verify_jwt = true

[functions.document-extract]
verify_jwt = true

# Lecture du texte d'un document (Gemini, avec accord) : transcription seule, jamais journalisée
[functions.document-read]
verify_jwt = true

# Analyse pédagogique d'une photo de glaire cervicale (Gemini) : jamais stockée ni journalisée
[functions.cycle-photo]
verify_jwt = true

# Flux d'abonnement iCalendar (Google Agenda, Apple Calendrier, Outlook) : protégé par un jeton
# secret propre à chaque lien (empreinte en base, révocable) ; les agendas externes n'envoient pas de JWT.
[functions.calendar-feed]
verify_jwt = false

# Appelées par des services externes : protégées par un secret partagé
[functions.revenuecat-webhook]
verify_jwt = false

[functions.send-push]
verify_jwt = false

# E-mails d'authentification (confirmation, connexion, mot de passe oublié) envoyés via Resend
# par la fonction auth-email. En production : Dashboard › Authentication › Hooks › Send Email Hook
# (type HTTPS, URL https://<ref>.supabase.co/functions/v1/auth-email), puis copier le secret
# généré dans `supabase secrets set SEND_EMAIL_HOOK_SECRET=v1,whsec_...`.
# Désactivé ici (sinon `supabase db push` refuse la configuration tant que le secret n'existe pas) :
# en production, le hook s'active dans le tableau de bord une fois Resend configuré.
[auth.hook.send_email]
enabled = false
uri = "http://host.docker.internal:54321/functions/v1/auth-email"
secrets = "env(SEND_EMAIL_HOOK_SECRET)"

[functions.auth-email]
verify_jwt = false

[functions.service-status]
verify_jwt = true

# Déclarées explicitement (audit du 01/11/2026) : appelées par l'application, jeton de connexion obligatoire
[functions.community-ai]
verify_jwt = true

[functions.places]
verify_jwt = true

# Relecture de l'abonnement chez RevenueCat par la personne connectée (clé secrète côté serveur uniquement)
[functions.subscription-sync]
verify_jwt = true
